<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1 class="app__title">Todo List</h1>
        <p class="app__subtitle">Keep track of the things you need to get done.</p>
      </header>

      <form class="task-form" id="task-form">
        <label class="task-form__label" for="task-input">Add a task</label>
        <div class="task-form__controls">
          <input
            id="task-input"
            class="task-form__input"
            type="text"
            name="task"
            placeholder="e.g. Buy groceries"
            autocomplete="off"
            required
          />
          <button class="task-form__button" type="submit">Add</button>
        </div>
      </form>

      <section class="task-list" aria-live="polite">
        <h2 class="task-list__title">Tasks</h2>
        <ul class="task-list__items" id="task-list"></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
